services:
  awsl-webadb:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5037:5037"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ADB_SERVER_HOST: 127.0.0.1
      ADB_SERVER_PORT: 5037
    volumes:
      - awsl-webadb-data:/var/lib/awsl-webadb
    restart: unless-stopped

volumes:
  awsl-webadb-data:
