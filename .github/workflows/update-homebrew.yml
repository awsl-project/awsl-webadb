name: Update Homebrew Formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released version (vX.Y.Z)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-homebrew
  cancel-in-progress: false

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate Formula from released checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
          node -e 'const {version} = require("./package.json"); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag does not match the default branch version");'
          mkdir -p .release Formula
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir .release
          node scripts/homebrew-formula.mjs "$RELEASE_TAG" .release/SHA256SUMS > Formula/awsl-webadb.rb
          ruby -c Formula/awsl-webadb.rb

      - name: Update Formula in this repository
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/awsl-webadb.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update Homebrew Formula to $RELEASE_TAG"
          git push
