name: Docker Image CI

on:
  push:
    tags:
      - "*"
  workflow_call:
    inputs:
      tag:
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set image name
        id: image
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Install FFmpeg for media regression tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run regression tests
        run: bun test

      - name: Build frontend
        run: bun run build

      - name: Prepare release artifacts
        run: |
          mkdir -p .release
          bun build --compile --minify --target=bun-linux-x64-modern ./server/index.ts --outfile .release/awsl-webadb-linux-amd64
          bun build --compile --minify --target=bun-linux-arm64 ./server/index.ts --outfile .release/awsl-webadb-linux-arm64
          bun build --compile --minify --target=bun-linux-x64-baseline ./cli/index.ts --outfile .release/webadb-linux-amd64
          bun build --compile --minify --target=bun-linux-arm64 ./cli/index.ts --outfile .release/webadb-linux-arm64
          bun build --compile --minify --target=bun-darwin-x64-baseline ./cli/index.ts --outfile .release/webadb-macos-amd64
          bun build --compile --minify --target=bun-darwin-arm64 ./cli/index.ts --outfile .release/webadb-macos-arm64

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest

      - name: Publish CLI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" .release/webadb-* --clobber
          else
            gh release create "$RELEASE_TAG" .release/webadb-* --title "$RELEASE_TAG" --generate-notes
          fi
