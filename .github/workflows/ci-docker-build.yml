name: Build and Release

on:
  push:
    tags:
      - "*"
  workflow_call:
    inputs:
      tag:
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set image name
        id: image
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Install FFmpeg for media regression tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run regression tests
        run: bun test

      - uses: ./.github/actions/build-camera

      - name: Audit dependencies
        run: bun audit

      - name: Build frontend
        run: bun run build

      - name: Prepare release artifacts
        env:
          RELEASE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          node -e 'const {version} = require("./package.json"); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag does not match package version");'
          mkdir -p .release
          bun build --compile --minify --asset ./dist --target=bun-linux-x64-baseline ./cli/index.ts --outfile .release/awsl-webadb-linux-amd64
          bun build --compile --minify --asset ./dist --target=bun-linux-arm64 ./cli/index.ts --outfile .release/awsl-webadb-linux-arm64
          bun build --compile --minify --asset ./dist --target=bun-darwin-x64-baseline ./cli/index.ts --outfile .release/awsl-webadb-macos-amd64
          bun build --compile --minify --asset ./dist --target=bun-darwin-arm64 ./cli/index.ts --outfile .release/awsl-webadb-macos-arm64
          (cd .release && sha256sum awsl-webadb-* > SHA256SUMS)
          node scripts/homebrew-formula.mjs "$RELEASE_TAG" .release/SHA256SUMS > .release/awsl-webadb.rb
          ruby -c .release/awsl-webadb.rb

      - name: Verify standalone server and client
        run: node scripts/smoke-binary.mjs .release/awsl-webadb-linux-amd64

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest

      - name: Publish standalone binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" .release/awsl-webadb-* .release/SHA256SUMS .release/awsl-webadb.rb --clobber
          else
            gh release create "$RELEASE_TAG" .release/awsl-webadb-* .release/SHA256SUMS .release/awsl-webadb.rb --title "$RELEASE_TAG" --generate-notes
          fi

  update-homebrew:
    needs: build-and-push-image
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
