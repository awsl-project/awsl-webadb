name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: ./.github/actions/build-camera
      - run: bun run check
      - run: bun test
      - run: bun audit
      - run: bun run build:binary
      - run: bun run pwa:check
      - run: node scripts/smoke-binary.mjs bin/awsl-webadb
