<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="浏览器通过后端 ADB bridge 连接 USB 或 Wi-Fi Android 设备。"
    />
    <meta name="theme-color" content="#282c34" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem("webadb.desktop-settings.v1") || "null");
        const selected = saved?.theme;
        const theme = selected === "dark" || selected === "light"
          ? selected
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#282c34" : "#fafafa";
      } catch {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WebADB" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/pwa-icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#61afef" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-120.png" sizes="120x120" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-152.png" sizes="152x152" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-167.png" sizes="167x167" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>WebADB Desk</title>
  </head>
  <body>
    <div id="root"></div>
    <div class="ios-pwa-status-strip" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
