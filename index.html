<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="浏览器通过后端 ADB bridge 连接 USB 或 Wi-Fi Android 设备。"
    />
    <meta name="theme-color" content="#282c34" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem("webadb.desktop-settings.v1") || "null");
        const selected = saved?.theme;
        const theme = selected === "dark" || selected === "light"
          ? selected
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#282c34" : "#fafafa";
      } catch {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WebADB" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>WebADB Desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
